<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<template id="__bundler_thumbnail" data-bg-color="#0A0A0B">
  <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <circle cx="60" cy="60" r="10" fill="#C20A62"/>
    <circle cx="60" cy="60" r="26" fill="none" stroke="#C20A62" stroke-opacity="0.4" stroke-width="2"/>
  </svg>
</template>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ANTA — Loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; background: #0A0A0B; }
  * { box-sizing: border-box; }
  body { font-family: 'Space Grotesk', Helvetica, Arial, sans-serif; }
  @keyframes anta-breathe { 0%, 100% { opacity: .3 } 50% { opacity: 1 } }
  @keyframes anta-sweep { 0% { top: -2%; opacity: 1 } 100% { top: 102%; opacity: .25 } }
  @keyframes anta-spin { to { transform: rotate(360deg) } }
</style>
</helmet>

<div style="position: fixed; inset: 0; background: #0A0A0B; overflow: hidden;">

  <iframe src="ANTA%20Site.dc.html" title="ANTA" style="position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #F7F6F3;"></iframe>

  <sc-if value="{{ showOverlay }}" hint-placeholder-val="{{ true }}">
    <div onClick="{{ skip }}" style="position: absolute; inset: 0; background: #0A0A0B; z-index: 5; cursor: pointer; clip-path: {{ overlayClip }}; transition: clip-path 0.75s cubic-bezier(.4,0,.2,1);">

      <canvas ref="{{ setCanvasRef }}" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;"></canvas>
      <div aria-hidden="true" style="position: absolute; top: -28%; left: 50%; width: 62vw; height: 62vw; transform: translateX(-50%); pointer-events: none; opacity: .14; background: radial-gradient(circle, #C20A62 0%, transparent 62%);"></div>

      <sc-if value="{{ isExiting }}" hint-placeholder-val="{{ false }}">
        <div aria-hidden="true" style="position: absolute; left: 0; right: 0; height: 2px; pointer-events: none; background: linear-gradient(to right, transparent, #C20A62, transparent); animation: anta-sweep 0.7s ease forwards;"></div>
      </sc-if>

      <div aria-hidden="true" style="position: absolute; top: 22px; left: 22px; width: 18px; height: 18px; border-top: 1px solid rgba(247,246,243,0.2); border-left: 1px solid rgba(247,246,243,0.2); pointer-events: none; opacity: {{ bracketOpacity }}; transform: {{ bracketScale }}; transform-origin: top left; transition: opacity .5s cubic-bezier(.34,1.56,.64,1), transform .5s cubic-bezier(.34,1.56,.64,1);"></div>
      <div aria-hidden="true" style="position: absolute; top: 22px; right: 22px; width: 18px; height: 18px; border-top: 1px solid rgba(247,246,243,0.2); border-right: 1px solid rgba(247,246,243,0.2); pointer-events: none; opacity: {{ bracketOpacity }}; transform: {{ bracketScale }}; transform-origin: top right; transition: opacity .5s cubic-bezier(.34,1.56,.64,1), transform .5s cubic-bezier(.34,1.56,.64,1);"></div>
      <div aria-hidden="true" style="position: absolute; bottom: 22px; left: 22px; width: 18px; height: 18px; border-bottom: 1px solid rgba(247,246,243,0.2); border-left: 1px solid rgba(247,246,243,0.2); pointer-events: none; opacity: {{ bracketOpacity }}; transform: {{ bracketScale }}; transform-origin: bottom left; transition: opacity .5s cubic-bezier(.34,1.56,.64,1), transform .5s cubic-bezier(.34,1.56,.64,1);"></div>
      <div aria-hidden="true" style="position: absolute; bottom: 22px; right: 22px; width: 18px; height: 18px; border-bottom: 1px solid rgba(247,246,243,0.2); border-right: 1px solid rgba(247,246,243,0.2); pointer-events: none; opacity: {{ bracketOpacity }}; transform: {{ bracketScale }}; transform-origin: bottom right; transition: opacity .5s cubic-bezier(.34,1.56,.64,1), transform .5s cubic-bezier(.34,1.56,.64,1);"></div>

      <div style="position: absolute; top: 22px; left: 46px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; color: rgba(247,246,243,0.26); pointer-events: none;">T+{{ elapsed }}s</div>
      <div style="position: absolute; top: 22px; right: 46px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; color: rgba(247,246,243,0.26); pointer-events: none;">SYS&nbsp;0x{{ hexReadout }}</div>

      <div style="position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 24px; opacity: {{ contentOpacity }}; transform: {{ contentTransform }}; transition: opacity 0.35s ease, transform 0.35s ease;">

        <div style="display: flex; align-items: center; gap: 9px; margin-bottom: 30px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #7C7A73;">
          <span style="width: 6px; height: 6px; background: #C20A62; animation: anta-breathe 2.2s ease-in-out infinite;"></span>
          AI Studio
        </div>

        <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 34px;">
          <img src="assets/anta-mark.png" alt="ANTA" style="height: 40px; width: auto; display: block; opacity: {{ markOpacity }}; transform: {{ markScale }}; transition: opacity .4s ease, transform .4s cubic-bezier(.34,1.56,.64,1);" />
          <div style="display: flex;">
            <sc-for list="{{ letters }}" as="l" hint-placeholder-count="4">
              <span style="display: inline-block; font-weight: 700; font-size: 30px; letter-spacing: 0.16em; color: #F7F6F3; line-height: 1; opacity: {{ l.opacity }}; transform: {{ l.transform }}; transition: opacity .4s ease, transform .4s cubic-bezier(.2,.9,.3,1);">{{ l.ch }}</span>
            </sc-for>
          </div>
        </div>

        <div style="height: 118px; width: 300px; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; margin-bottom: 30px; overflow: hidden; font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.6;">
          <sc-for list="{{ rows }}" as="r" hint-placeholder-count="0">
            <div style="display: flex; gap: 10px; color: {{ r.color }};">
              <span style="color: #5F5D57; flex-shrink: 0;">{{ r.mark }}</span>
              <span>{{ r.text }}</span>
            </div>
          </sc-for>
        </div>

        <div style="display: flex; align-items: center; gap: 3px; width: 300px; margin-bottom: 14px;">
          <sc-for list="{{ ticks }}" as="tk" hint-placeholder-count="28">
            <span style="flex: 1 1 auto; height: {{ tk.h }}px; background: {{ tk.c }}; box-shadow: {{ tk.glow }};"></span>
          </sc-for>
        </div>

        <div style="display: flex; align-items: center; gap: 12px; width: 300px; justify-content: flex-end;">
          <span aria-hidden="true" style="width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid rgba(247,246,243,0.16); border-top-color: #C20A62; animation: anta-spin 0.9s linear infinite; opacity: {{ spinnerOpacity }};"></span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; color: #F7F6F3; min-width: 46px; text-align: right; font-variant-numeric: tabular-nums;">{{ progressLabel }}</span>
        </div>

      </div>

      <div style="position: absolute; bottom: 54px; left: 0; right: 0; display: flex; justify-content: center; pointer-events: none;">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(247,246,243,0.32); opacity: {{ skipHintOpacity }}; transition: opacity 0.6s ease;">click to skip</span>
      </div>

      <div style="position: absolute; bottom: 22px; left: 46px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: rgba(247,246,243,0.24); pointer-events: none;">ANTA&nbsp;/&nbsp;SYS.BOOT</div>
      <div style="position: absolute; bottom: 22px; right: 46px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: rgba(247,246,243,0.24); pointer-events: none;">REV&nbsp;A&nbsp;·&nbsp;BUILD&nbsp;2026.08</div>

    </div>
  </sc-if>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>

class Component extends DCLogic {
  state = { progress: 0, completed: 0, phase: 'boot', showOverlay: true, skipHintOpacity: 0, mounted: false, tick: 0 };

  steps = [
    { label: 'initializing ai studio', pct: 20 },
    { label: 'loading systems catalog', pct: 44 },
    { label: 'calibrating agents', pct: 70 },
    { label: 'compiling interface', pct: 92 },
    { label: 'ready', pct: 100 }
  ];

  word = 'ANTA';

  componentDidMount() {
    this._t0 = performance.now();
    this._progress = 0;
    this._stepStart = performance.now();
    this._reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    requestAnimationFrame(() => this.setState({ mounted: true }));
    this.startTimer = setTimeout(() => this.runSteps(), 450);
    this.hintTimer = setTimeout(() => this.setState({ skipHintOpacity: 1 }), 1400);
    this.tickTimer = setInterval(() => this.setState(s => ({ tick: s.tick + 1 })), 60);
  }

  componentWillUnmount() {
    clearTimeout(this.startTimer);
    clearTimeout(this.hintTimer);
    clearTimeout(this.checkpointTimer);
    clearTimeout(this.finishTimer);
    clearTimeout(this.irisTimer);
    clearTimeout(this.doneTimer);
    clearInterval(this.tickTimer);
    if (this.raf) cancelAnimationFrame(this.raf);
    if (this.canvasRaf) cancelAnimationFrame(this.canvasRaf);
    if (this.resizeHandler) window.removeEventListener('resize', this.resizeHandler);
  }

  ease(x) { return 1 - Math.pow(1 - x, 3); }

  animateProgress(from, to, dur, cb) {
    const t0 = performance.now();
    const tick = now => {
      const p = Math.min(1, (now - t0) / dur);
      const val = from + (to - from) * this.ease(p);
      this._progress = val;
      this.setState({ progress: val });
      if (p < 1) { this.raf = requestAnimationFrame(tick); }
      else { cb(); }
    };
    this.raf = requestAnimationFrame(tick);
  }

  runSteps(i = 0) {
    if (this.state.phase !== 'boot') return;
    if (i >= this.steps.length) { this.finish(); return; }
    this._stepStart = performance.now();
    const from = i === 0 ? 0 : this.steps[i - 1].pct;
    const step = this.steps[i];
    this.animateProgress(from, step.pct, 560, () => {
      this.setState({ completed: i + 1 });
      this.checkpointTimer = setTimeout(() => this.runSteps(i + 1), 220);
    });
  }

  finish() {
    clearInterval(this.tickTimer);
    this.finishTimer = setTimeout(() => {
      this.setState({ phase: 'exit' });
      this.irisTimer = setTimeout(() => this.setState({ phase: 'exit-iris' }), 260);
      this.doneTimer = setTimeout(() => this.setState({ showOverlay: false }), 260 + 780);
    }, 420);
  }

  skip() {
    if (this.state.phase !== 'boot') return;
    clearTimeout(this.startTimer);
    clearTimeout(this.checkpointTimer);
    if (this.raf) cancelAnimationFrame(this.raf);
    this._progress = 100;
    this.setState({ progress: 100, completed: this.steps.length });
    this.finish();
  }

  setCanvasRef(el) {
    if (!el || this.canvasEl === el) return;
    this.canvasEl = el;
    this.initCanvas();
  }

  initCanvas() {
    const canvas = this.canvasEl, ctx = canvas.getContext('2d');
    this.ctx = ctx;
    this.particles = Array.from({ length: 16 }, () => ({
      x: Math.random(), y: Math.random(),
      vx: (Math.random() - 0.5) * 0.00016, vy: (Math.random() - 0.5) * 0.00016
    }));
    const resize = () => {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, rect.width * dpr);
      canvas.height = Math.max(1, rect.height * dpr);
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      this.w = rect.width; this.h = rect.height;
    };
    this.resizeHandler = resize;
    window.addEventListener('resize', resize);
    resize();
    const loop = t => { this.draw(t); this.canvasRaf = requestAnimationFrame(loop); };
    if (!this._reduced) { this.canvasRaf = requestAnimationFrame(loop); } else { this.draw(0); }
  }

  draw(t) {
    const ctx = this.ctx, w = this.w, h = this.h;
    if (!ctx || !w || !h) return;
    ctx.clearRect(0, 0, w, h);
    const progress = this._progress || 0;
    const explode = 1 - progress / 100;

    // ambient particle network
    this.particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > 1) p.vx *= -1;
      if (p.y < 0 || p.y > 1) p.vy *= -1;
    });
    const pts = this.particles.map(p => ({ x: p.x * w, y: p.y * h }));
    const maxDist = Math.min(180, w * 0.2);
    for (let i = 0; i < pts.length; i++) {
      for (let j = i + 1; j < pts.length; j++) {
        const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < maxDist) {
          ctx.strokeStyle = 'rgba(194,10,98,' + ((1 - d / maxDist) * 0.1) + ')';
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[j].x, pts[j].y); ctx.stroke();
        }
      }
    }
    pts.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, 1.4, 0, Math.PI * 2); ctx.fillStyle = 'rgba(194,10,98,0.35)'; ctx.fill(); });

    // horizontal scan sweep
    const period = 3600;
    const sy = ((t % period) / period) * (h + 80) - 40;
    const grad = ctx.createLinearGradient(0, sy - 30, 0, sy + 30);
    grad.addColorStop(0, 'rgba(247,246,243,0)');
    grad.addColorStop(0.5, 'rgba(247,246,243,0.05)');
    grad.addColorStop(1, 'rgba(247,246,243,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, sy - 30, w, 60);

    // exploded plate assembly
    const pw = Math.min(w * 0.5, 460), sk = pw * 0.32, pd = pw * 0.18;
    const gapBase = Math.min(Math.max(h * 0.1, 34), 72);
    const gap = gapBase * explode;
    const cx = w * 0.5, cy = h * 0.56;
    const x0 = cx - (pw + sk) / 2;
    const plates = [];
    for (let i = 0; i < 3; i++) {
      const y = cy + gap - i * gap;
      plates.push([[x0, y], [x0 + pw, y], [x0 + pw + sk, y - pd], [x0 + sk, y - pd]]);
    }
    const axisA = 0.14 * explode;
    if (axisA > 0.01) {
      ctx.save(); ctx.setLineDash([3, 5]); ctx.strokeStyle = 'rgba(247,246,243,' + axisA + ')'; ctx.lineWidth = 1;
      for (let c = 0; c < 4; c++) {
        ctx.beginPath(); ctx.moveTo(plates[0][c][0], plates[0][c][1]); ctx.lineTo(plates[2][c][0], plates[2][c][1]); ctx.stroke();
      }
      ctx.restore();
    }
    const acc = { r: 194, g: 10, b: 98 };
    plates.forEach((q, i) => {
      const blend = Math.min(1, progress / 100) * (i === 1 ? 1 : 0.5);
      const cr = Math.round(247 + (acc.r - 247) * blend * 0.5);
      ctx.strokeStyle = 'rgba(247,246,243,' + (0.13 + 0.1 * blend) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath();
      q.forEach((c, k) => k === 0 ? ctx.moveTo(c[0], c[1]) : ctx.lineTo(c[0], c[1]));
      ctx.closePath(); ctx.stroke();
      q.forEach(c => {
        ctx.beginPath(); ctx.arc(c[0], c[1], 1.6, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(194,10,98,' + (0.25 + 0.35 * blend) + ')'; ctx.fill();
      });
    });
    ctx.font = '9px "JetBrains Mono", monospace';
    ctx.fillStyle = 'rgba(247,246,243,0.22)';
    ctx.textAlign = 'center';
    ctx.fillText('Δ ' + Math.round(gap) + 'px', cx + sk / 2, plates[0][0][1] + 24);
    ctx.textAlign = 'left';
  }

  typedText(label) {
    const dur = 480;
    const p = Math.min(1, (performance.now() - this._stepStart) / dur);
    const n = Math.ceil(label.length * p);
    return label.slice(0, n);
  }

  renderVals() {
    const s = this.state;
    const progress = Math.round(s.progress * 10) / 10;
    const rows = [];
    for (let i = 0; i < s.completed; i++) rows.push({ text: this.steps[i].label, mark: '✓', color: '#5F5D57' });
    if (s.completed < this.steps.length && s.phase === 'boot') {
      rows.push({ text: this.typedText(this.steps[s.completed].label), mark: '›', color: '#D9D7D0' });
    } else if (s.completed < this.steps.length) {
      rows.push({ text: this.steps[s.completed].label, mark: '›', color: '#D9D7D0' });
    }

    const letters = this.word.split('').map((ch, i) => {
      const th = (i + 1) * (100 / this.word.length) - 8;
      const on = progress >= th;
      return { ch, opacity: on ? 1 : 0, transform: on ? 'translateY(0)' : 'translateY(10px)' };
    });

    const N = 28;
    const ticks = Array.from({ length: N }, (_, i) => {
      const th = (i / N) * 100;
      const on = progress >= th;
      const lead = on && progress < th + (100 / N);
      return { h: lead ? 14 : 10, c: on ? '#C20A62' : 'rgba(247,246,243,0.14)', glow: lead ? '0 0 8px rgba(194,10,98,0.8)' : 'none' };
    });

    const elapsedMs = this._t0 ? (performance.now() - this._t0) / 1000 : 0;
    const hexBase = s.phase === 'boot' ? Math.floor(performance.now() / 55) % 65536 : 12079;
    const hexReadout = hexBase.toString(16).toUpperCase().padStart(4, '0');

    return {
      progressLabel: Math.round(progress) + '%',
      rows,
      letters,
      ticks,
      showOverlay: s.showOverlay,
      isExiting: s.phase === 'exit' || s.phase === 'exit-iris',
      overlayClip: s.phase === 'exit-iris' ? 'circle(0% at 50% 50%)' : 'circle(150% at 50% 50%)',
      contentOpacity: s.phase === 'boot' ? 1 : 0,
      contentTransform: s.phase === 'boot' ? 'translateY(0)' : 'translateY(-10px)',
      markOpacity: s.mounted ? 1 : 0,
      markScale: s.mounted ? 'scale(1)' : 'scale(.7)',
      bracketOpacity: s.mounted ? 1 : 0,
      bracketScale: s.mounted ? 'scale(1)' : 'scale(.6)',
      spinnerOpacity: s.phase === 'boot' ? 1 : 0,
      elapsed: elapsedMs.toFixed(3),
      hexReadout,
      skipHintOpacity: s.skipHintOpacity,
      skip: () => this.skip()
    };
  }
}

</script>
</body>
</html>
